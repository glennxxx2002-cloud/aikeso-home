<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AiKESO 醫師端">
<meta name="color-scheme" content="light dark">
<title>AiKESO@Home 醫師端 App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" media="print" onload="this.media='all'"><!-- 非阻塞：連不到 Google Fonts 時直接用系統字型（Microsoft JhengHei／PingFang） -->
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEEF4; --line:#D8DEE8; --line-soft:#E8ECF2;
  --ink:#16202E; --ink-2:#4A5A70; --ink-3:#7C8AA0;
  --brand:#1E3A66; --brand-ink:#FFFFFF; --accent:#0F7A78; --accent-soft:#DCEFEE; --accent-ink:#0B5F5D;
  --green:#1F8F5A; --green-soft:#DDF3E7; --yellow:#B7780A; --yellow-soft:#FBEED2; --red:#C93A3A; --red-soft:#F9DEDE; --dq:#5D6E86; --dq-soft:#E4E9F0;
  --shadow:0 1px 2px rgba(22,32,46,.06),0 6px 20px rgba(22,32,46,.06);
  --radius:10px; --radius-sm:6px;
  --font:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141C; --surface:#161E29; --surface-2:#1E2836; --line:#2C3847; --line-soft:#232E3C;
    --ink:#E7ECF3; --ink-2:#AEBACB; --ink-3:#7F8DA1;
    --brand:#2B4C82; --brand-ink:#FFFFFF; --accent:#3BB3AE; --accent-soft:#163C3B; --accent-ink:#8FE0DB;
    --green:#3FCB86; --green-soft:#153826; --yellow:#F0B429; --yellow-soft:#3E2E0C; --red:#F26D6D; --red-soft:#4A1E1E; --dq:#9AA8BC; --dq-soft:#26303E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#161E29; --surface-2:#1E2836; --line:#2C3847; --line-soft:#232E3C;
  --ink:#E7ECF3; --ink-2:#AEBACB; --ink-3:#7F8DA1;
  --brand:#2B4C82; --brand-ink:#FFFFFF; --accent:#3BB3AE; --accent-soft:#163C3B; --accent-ink:#8FE0DB;
  --green:#3FCB86; --green-soft:#153826; --yellow:#F0B429; --yellow-soft:#3E2E0C; --red:#F26D6D; --red-soft:#4A1E1E; --dq:#9AA8BC; --dq-soft:#26303E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 9px}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:14px;padding:0 16px;height:52px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:23.5px;letter-spacing:.2px}
.brand small{opacity:.8;font-size:16.5px}
.demo{font-family:var(--mono);font-size:14.5px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);padding:2px 7px;border-radius:4px}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:3px;margin-left:auto}
.seg button{padding:5px 14px;border-radius:6px;color:rgba(255,255,255,.85);font-weight:500}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.clock{font-family:var(--mono);font-size:17.5px;opacity:.9;white-space:nowrap}
.tb-btn{border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:4px 9px;font-size:16.5px;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,.12)}
@media (max-width:900px){.brand small,.clock{display:none}.topbar{gap:8px;padding:0 10px}.seg button{padding:5px 9px}}
@media (max-width:640px){.topbar{flex-wrap:wrap;height:auto;padding:8px 10px;row-gap:8px}.seg{order:9;width:100%;margin-left:0}.seg button{flex:1;padding:6px 4px;font-size:17.5px;white-space:nowrap}#btn-about{display:none}.brand b{font-size:20.5px}}

/* ---------- generic ---------- */
main{padding:16px;max-width:1500px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.card-h h3{font-size:19.5px}
.card-h .sub{font-size:16.5px;color:var(--ink-3)}
.card-h .spacer{margin-left:auto}
.card-b{padding:12px 14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:6px 11px;font-size:18px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 8px;font-size:16.5px}
.btn.xs{padding:2px 7px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:16.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.yellow{background:var(--yellow-soft);color:var(--yellow)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.dq{background:var(--dq-soft);color:var(--dq)}
.pill.dq::before{border-radius:2px;transform:rotate(45deg);width:7px;height:7px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:16px;color:var(--ink-2);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.st{display:inline-block;border-radius:4px;padding:1px 7px;font-size:16px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.st.s0{background:var(--red-soft);color:var(--red)}
.st.s1{background:var(--yellow-soft);color:var(--yellow)}
.st.s2{background:var(--accent-soft);color:var(--accent-ink)}
.st.s3{background:var(--dq-soft);color:var(--dq)}
.st.s4{background:var(--green-soft);color:var(--green)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:18px}
.kv dt{color:var(--ink-3);white-space:nowrap}.kv dd{margin:0}
table.t{width:100%;border-collapse:collapse;font-size:18px}
table.t th{font-weight:600;font-size:16px;letter-spacing:.04em;color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.row{cursor:pointer}
table.t tbody tr.row:hover{background:var(--surface-2)}
.scroll-x{overflow-x:auto}
.grid{display:grid;gap:14px}
.stripe{border-left:4px solid var(--line)}
.stripe.red{border-left-color:var(--red)}.stripe.yellow{border-left-color:var(--yellow)}.stripe.green{border-left-color:var(--green)}.stripe.dq{border-left-color:var(--dq)}
.note{font-size:16.5px;color:var(--ink-3);line-height:1.45}
.empty{padding:22px;text-align:center;color:var(--ink-3);font-size:18px}
.hr{height:1px;background:var(--line-soft);margin:10px 0}
details.acc{border:1px solid var(--line-soft);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--surface)}
details.acc summary{padding:9px 12px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";margin-left:auto;color:var(--ink-3);font-weight:400}
details.acc[open] summary::after{content:"－"}
details.acc .acc-b{padding:0 12px 12px;font-size:18.5px;line-height:1.65}

/* ---------- war room ---------- */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:16px;color:var(--ink-3);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:35.5px;font-weight:500;line-height:1.15;margin-top:2px}
.kpi .v small{font-size:18px;color:var(--ink-3);font-weight:400}
.kpi .s{font-size:16px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.alert .v{color:var(--red)}
.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.war{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(360px,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.war{grid-template-columns:1fr}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.paths{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:760px){.paths{grid-template-columns:repeat(2,minmax(0,1fr))}}
.path{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;min-width:0}
.path:hover{border-color:var(--accent)}
.path[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.path .n{font-family:var(--mono);font-size:33.5px;font-weight:500;line-height:1.1}
.path .n small{font-size:16.5px;color:var(--ink-3);font-weight:400;font-family:var(--font)}
.path .t{font-weight:600;font-size:18px}
.path .d{font-size:16px;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path .dots{display:flex;gap:4px;margin-top:6px}
.path .dots i{width:9px;height:9px;border-radius:50%;display:block}
.alist{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;padding:9px 10px 9px 12px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--surface);align-items:start}
.al .who{font-weight:600;font-size:18px}
.al .what{font-size:17.5px;color:var(--ink-2);margin-top:1px}
.al .meta{font-size:16px;color:var(--ink-3);font-family:var(--mono);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.al .meta .over{color:var(--red);font-weight:600}
.al .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.ops{display:flex;flex-direction:column;gap:9px}
.op{display:grid;grid-template-columns:110px 1fr 56px;align-items:center;gap:10px;font-size:18px}
.op .num{text-align:right;color:var(--ink-2)}
.op .bar{margin:0;height:7px}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:16.5px;color:var(--ink-2);align-items:center}

/* ---------- drawer / modal / toast ---------- */
.drawer{position:fixed;top:52px;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:40;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .d-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.drawer .d-b{overflow:auto;padding:14px 16px;flex:1}
.scrim{position:fixed;inset:52px 0 0 0;background:rgba(10,16,24,.35);z-index:35;display:none}
.scrim.on{display:block}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,16,24,.45);padding:20px}
.modal.on{display:flex}
.call119{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:#b01f1f;padding:24px;color:#fff;text-align:center}.call119.on{display:flex}.c119{max-width:520px;width:100%}.c119-h{font-size:36px;font-weight:800;line-height:1.25;margin-bottom:12px}.c119-s{font-size:19.5px;line-height:1.6;margin-bottom:18px}.c119-btn{display:block;width:100%;background:#fff;color:#b91c1c;font-size:32px;font-weight:800;padding:22px 16px;border-radius:18px;border:0;margin-bottom:14px;cursor:pointer}.c119-n{font-size:17px;line-height:1.65;opacity:.95;margin-bottom:18px}.c119-x{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff;border-radius:12px;padding:12px 18px;font-size:17px;cursor:pointer}
.modal .m{background:var(--surface);border-radius:12px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .m-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.modal .m-b{padding:14px 16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:18px;z-index:60;transition:all .2s;max-width:min(560px,92vw);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- case card (shared) ---------- */
.case-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.case-h .nm{font-size:23.5px;font-weight:700}
.case-h .id{font-family:var(--mono);color:var(--ink-3);font-size:16.5px}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.vitals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.vt{border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:7px 9px;min-width:0}
.vt .l{font-size:15px;color:var(--ink-3);letter-spacing:.03em}
.vt .v{font-family:var(--mono);font-size:26.5px;font-weight:500;line-height:1.15}
.vt .b{font-size:15px;color:var(--ink-3);font-family:var(--mono)}
.vt.off .v{color:var(--yellow)}.vt.crit .v{color:var(--red)}
.sparks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.spark{border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:7px 9px 4px}
.spark .l{display:flex;justify-content:space-between;font-size:16px;color:var(--ink-3)}
.spark .l b{color:var(--ink);font-family:var(--mono);font-weight:500}
.spark svg{width:100%;height:56px;display:block}
.reasons{display:flex;flex-direction:column;gap:4px;font-size:18px}
.reasons li{list-style:none}
.reasons ul{margin:0;padding:0}
.ai{border:1px dashed var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:18px;line-height:1.6;background:var(--surface-2)}
.ai .ttl{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px;font-family:var(--mono)}
.ai p{margin:0 0 6px}
.ddx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.ddx{grid-template-columns:1fr}}
.ddx .col h4{font-size:17.5px;margin-bottom:6px}
.dx{border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:7px 9px;margin-bottom:6px;font-size:17.5px}
.dx b{display:block;font-size:18px}
.dx .ev{margin-top:3px;display:flex;flex-direction:column;gap:2px}
.dx .ev span::before{display:inline-block;width:14px;font-family:var(--mono);font-weight:600}
.dx .ev .y::before{content:"＋";color:var(--green)}
.dx .ev .n::before{content:"－";color:var(--red)}
.dx .ev .u::before{content:"？";color:var(--ink-3)}
.log{font-size:17.5px;display:flex;flex-direction:column;gap:6px}
.log .e{display:grid;grid-template-columns:auto 1fr;gap:10px}
.log .e time{font-family:var(--mono);color:var(--ink-3);font-size:16px;white-space:nowrap}
.sec{margin-top:16px}
.sec h4{font-size:16.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-family:var(--mono);font-weight:600}
.status-flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:16px;color:var(--ink-3)}
.status-flow .s{padding:2px 7px;border-radius:4px;border:1px solid var(--line-soft)}
.status-flow .s.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.status-flow .s.done{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

/* ---------- phone ---------- */
.stage{display:grid;grid-template-columns:400px minmax(280px,420px);gap:24px;justify-content:center;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,400px)}}
.phone{width:400px;max-width:100%;height:820px;border-radius:38px;background:#0c0f14;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 0 0 2px #2a2f38;position:relative}
.phone .scr{background:var(--bg);border-radius:28px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#0c0f14;border-radius:0 0 18px 18px;z-index:5}
.ph-top{padding:34px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.ph-top .ttl{font-size:23.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.ph-top .sub{font-size:16.5px;color:var(--ink-3);margin-top:1px}
.ph-body{flex:1;overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px}
.ph-tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line-soft);padding:6px 4px 12px}
.ph-tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14.5px;color:var(--ink-3);padding:4px 0;border-radius:8px}
.ph-tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ph-tabs button[aria-selected="true"]{color:var(--accent)}
.ph-tabs button .bd{position:absolute;margin-left:22px;margin-top:-2px;background:var(--red);color:#fff;font-size:13px;font-family:var(--mono);border-radius:8px;padding:0 4px;line-height:14px}
.pcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 13px}
.pcard h3{font-size:18.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pcard h3 .r{margin-left:auto;font-weight:400;font-size:16.5px;color:var(--ink-3)}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:18.5px}
.task:last-child{border-bottom:0}
.task .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:16.5px}
.task.done .chk{background:var(--green);border-color:var(--green)}

function spark(vals, opts) {

const GEO_DISTRICTS={'北區':[335,2.3],'中區':[190,1.6],'東區':[120,2.6],'西區':[230,2.2],'南區':[175,3.6],'北屯區':[40,4.6],'西屯區':[275,5.6],'南屯區':[235,6.6],'太平區':[100,6.4],'大里區':[158,7.6],'潭子區':[15,6.8],'大雅區':[320,8.2],'烏日區':[205,10.4],'豐原區':[20,12.5],'霧峰區':[165,14],'大肚區':[240,14],'沙鹿區':[285,14.5],'龍井區':[262,15.5],'神岡區':[340,11.5],'清水區':[305,18.5],'后里區':[8,18.5]};
const GEO_VIEW={rx:58,rz:0};
function geoHash(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return h;}
function geoPlace(p,kmpx){
 kmpx=kmpx||GEO_KM_PX; const loc=twinLocation(p); const m=/臺中市(.+?區)/.exec(loc.address||''); const d=m&&GEO_DISTRICTS[m[1]];
 const h=geoHash(p.id), jitter=(h%25)-12;
 const km=loc.km!=null?loc.km:(d?d[1]:null);
 const bearing=d?d[0]+jitter:300+(h%40);
 const r=Math.min((km==null?8:km)*kmpx,305), a=bearing*Math.PI/180;
 return {x:GEO_SIZE/2+r*Math.sin(a),y:GEO_SIZE/2-r*Math.cos(a),km,district:d?m[1]:null,unset:!d,address:loc.address};
}
function geoMap(){
 const ps=state.patients.filter(p=>!state.filter||p.pathway===state.filter);
 const C=GEO_SIZE/2;
 const far=ps.reduce((m,p)=>Math.max(m,twinLocation(p).km||0),0);
 const budget=GEO_VIEW.rx<=5?212:290; /* 2D 平面時整張圖要塞進畫面高度 */
 const kmpx=Math.max(10,Math.min(26,budget/Math.max(far,5)));
 const step=far<=8?2:5, rings=[]; for(let k=step;k*kmpx<=budget+15;k+=step)rings.push(k);
 const pts=ps.map(p=>({p,l:lightOf(p),g:geoPlace(p,kmpx)}));
 const sorted=pts.slice().sort((a,b)=>(a.g.km??99)-(b.g.km??99));
 const counts={red:0,yellow:0,green:0,dq:0}; pts.forEach(x=>{counts[x.l.light]=(counts[x.l.light]||0)+1;});
 const ringsHtml=rings.map(k=>{const r=k*kmpx;return '<div class="geo-ring" style="width:'+r*2+'px;height:'+r*2+'px"></div><span class="geo-ringlabel" style="left:'+(C+r*0.7071).toFixed(1)+'px;top:'+(C-r*0.7071).toFixed(1)+'px">'+k+' km</span>';}).join('');
 const districts=Object.entries(GEO_DISTRICTS).filter(([k,[b,km]])=>km*kmpx<=budget+22).map(([k,[b,km]])=>{const a=b*Math.PI/180,r=km*kmpx;return '<span class="geo-district" style="left:'+(C+r*Math.sin(a)).toFixed(1)+'px;top:'+(C-r*Math.cos(a)).toFixed(1)+'px">'+k+'</span>';}).join('');
 const lines='<svg class="geo-lines" viewBox="0 0 '+GEO_SIZE+' '+GEO_SIZE+'" aria-hidden="true">'+pts.map(x=>'<line class="'+x.l.light+'" x1="'+C+'" y1="'+C+'" x2="'+x.g.x.toFixed(1)+'" y2="'+x.g.y.toFixed(1)+'"'+(x.g.unset?' stroke-dasharray="6 5"':'')+'/><circle class="'+x.l.light+'" cx="'+x.g.x.toFixed(1)+'" cy="'+x.g.y.toFixed(1)+'" r="4"/>').join('')+'</svg>';
 const pins=pts.map(x=>{const p=x.p,g=x.g;return '<button class="geo-pin '+x.l.light+(g.unset?' unset':'')+(g.x<C?' l':'')+'" data-case="'+esc(p.id)+'" style="left:'+g.x.toFixed(1)+'px;top:'+g.y.toFixed(1)+'px" aria-label="開啟 '+esc(p.name)+' '+p.id+' 個案卡（'+esc(g.district||'區域未設定')+'）"><span class="geo-stem"></span><span class="geo-head"></span><span class="geo-tag"><b>'+esc(p.name)+'</b> '+(g.km!=null?g.km.toFixed(1)+' km':'距離待確認')+'<small>'+esc(g.district||'區域未設定')+' · '+esc((PATHWAYS[p.pathway]||{}).short||p.pathway)+' · Day '+p.day+'</small></span></button>';}).join('');
 const hospital='<div class="geo-hospital" style="left:'+C+'px;top:'+C+'px"><span class="geo-hbase"></span><span class="geo-hmark"><b>'+GEO_CENTER.short+'</b><i>✚</i><u></u></span></div>';
 const rows=sorted.map(x=>{const p=x.p,g=x.g;return '<button class="geo-row" data-case="'+esc(p.id)+'">'+pill(x.l.light,x.l.light==='dq'?'待確認':LEVEL[x.l.light].slice(0,1))+'<span class="geo-rname"><b>'+esc(p.name)+'</b><small>'+p.id+' · '+esc(g.district||'區域未設定')+' · '+esc((PATHWAYS[p.pathway]||{}).short||'')+' · '+esc(p.route==='inst'?'機構':'居家')+'</small></span><span class="geo-rdist"><b>'+(g.km!=null?g.km.toFixed(1):'—')+'</b><small>km · '+esc(staff(p.rn))+'</small></span></button>';}).join('');
 return '<section class="tw-gallery geo"><div class="tw-heading"><div><h2>病人 3D 地圖分佈</h2><p>以中國醫藥大學附設醫院總院為中心，依住址行政區與返院距離標示在案病人；拖曳可旋轉與調整俯角，點選標記開啟個案卡</p></div><span>虛構個案・模擬座標｜'+ps.length+' 位・最遠 '+far.toFixed(1)+' km</span></div>'+
 '<div class="geo-wrap"><div class="geo-stage" id="geo-stage"><div class="geo-plane'+(GEO_VIEW.rx<=5?' flat':'')+'" style="--rx:'+GEO_VIEW.rx+'deg;--rz:'+GEO_VIEW.rz+'deg"><div class="geo-grid"></div>'+ringsHtml+lines+districts+pins+hospital+'<span class="geo-north">N</span></div>'+
 '<div class="geo-ctl"><button type="button" data-geo="tilt" aria-pressed="'+(GEO_VIEW.rx>5)+'">3D 俯瞰</button><button type="button" data-geo="flat" aria-pressed="'+(GEO_VIEW.rx<=5)+'">2D 平面</button><label>旋轉 <input type="range" min="-180" max="180" value="'+GEO_VIEW.rz+'" data-geo="rz" aria-label="旋轉地圖"></label><button type="button" data-geo="reset">重設</button></div>'+
 '<div class="geo-center">中心：<b>'+GEO_CENTER.name+'</b>（'+GEO_CENTER.addr+'）</div>'+
 '<div class="geo-legend"><span><i class="red"></i>紅 '+counts.red+'</span><span><i class="yellow"></i>黃 '+counts.yellow+'</span><span><i class="green"></i>綠 '+counts.green+'</span><span><i class="dq"></i>待確認 '+(counts.dq||0)+'</span><span>同心圓每 '+step+' 公里</span></div></div>'+
 '<aside class="geo-side"><h3>返院距離排序<small>近 → 遠</small></h3>'+rows+'</aside></div>'+
 '<p class="tw-foot">座標為示意：依住址行政區的概略方位與模擬公里數放置，非實際地理定位；行政區標籤亦為版面示意。正式版由戰情室資料層提供去識別後的地理編碼與路線距離，住址只顯示於有權限的照護人員畫面。</p></section>';
}
function geoApply(){
 const pl=document.querySelector('.geo-plane'); if(!pl)return;
 pl.style.setProperty('--rx',GEO_VIEW.rx+'deg'); pl.style.setProperty('--rz',GEO_VIEW.rz+'deg'); pl.classList.toggle('flat',GEO_VIEW.rx<=5);
 document.querySelectorAll('[data-geo="tilt"],[data-geo="flat"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.geo==='tilt'?GEO_VIEW.rx>5:GEO_VIEW.rx<=5)));

    if (!hasClaude() && !busy() && tried !== String(b)) { try { sessionStorage.setItem('aikeso-reload-for', String(b)); } catch (e) { } toast('有新版本，正在更新…', 2500); setTimeout(reload, 1500); return; } /* 每個新版本只自動重載一次，避免伺服器仍給舊檔時一直重載 */
    if (document.getElementById('upd-bar')) return;
    document.body.insertAdjacentHTML('afterbegin', '<div class="upd-bar" id="upd-bar" role="status"><b>有新版本</b><span>' + (hasClaude() ? '請重新整理此頁（瀏覽器的重新載入）' : '按「更新」載入最新版') + '</span>' + (hasClaude() ? '' : '<button type="button" class="btn sm primary" id="upd-go">更新</button>') + '</div>');
    const go = document.getElementById('upd-go'); if (go) go.addEventListener('click', reload);
  }
  window.__newerBuild = newerBuild; window.__appBuild = APP_BUILD;
  function stopAll() { clearInterval(pollTimer); clearInterval(hbInterval); pollTimer = null; hbInterval = null; stopped = true; }
  async function start(skipApi) {
    stopped = false; backoffUntil = 0;
    if (!apiUrl() && !hasClaude()) { T = null; setDot('off', '單機模式（沒有後端 API，也不在 claude.ai 內）'); return; }
    setDot('wait', apiUrl() && !skipApi ? '連線後端 API 中…' : '連線 Google 試算表連接器中…');
    T = await pickTransport(skipApi);
    if (!T) { setDot('off', apiUrl() ? '單機模式（後端 API 連不上，且此檢視沒有連接器）' : '單機模式（此檢視沒有連接器：未登入 claude.ai 或未授權）'); return; }
    window.__syncTransport = T.kind;
    /* 1) 首次讀取（連接器通道第一次會跳出「允許此頁使用 Google Sheets」） */
    refreshNow('首次連線').then(() => { heartbeat(); });
    /* 2) 固定輪詢（前景時）；回到前景立刻讀 */
    pollTimer = setInterval(() => { if (document.visibilityState === 'visible') { window.__syncStats.polls++; refreshNow('定時刷新'); } }, POLL_MS);
    hbInterval = setInterval(heartbeat, HEARTBEAT_MS);
    /* 3) 同一個網址內的其他裝置：room 通知，秒級（只在 claude.ai 內有） */
    if (hasClaude() && !roomSet) {
      roomSet = true;
      window.claude.use('room').then((room) => {
        if (!room) return;
        try {
          room.on('sync', (m) => { if (m && m.sameTab) return; window.__syncStats.pings++; refreshNow('即時通知'); }, () => { });
          window.__syncPing = () => { room.emit('sync', { at: Date.now(), by: roleNow() }).catch(() => { }); };
        } catch (e) { }
      }).catch(() => { });
    }
  }
  function restart(skipApi) { stopAll(); start(skipApi); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { refreshNow('回到前景'); heartbeat(); } });
  window.addEventListener('focus', () => refreshNow('回到前景'));
  /* 手動重試（授權被拒或連線錯誤時）；設定變更後重新連線 */
  window.__syncRetry = () => { apiBroken = false; backoffUntil = 0; if (!T || stopped) restart(false); else refreshNow('手動重試'); };
  window.__syncRestart = () => { apiBroken = false; restart(false); };
  start(false);
})();

</script>
